include:
  - project: $CATALOG_PATH
    file:
      - vault-ci.yml
      - kaniko-ci.yml
      # Temporarily unused: `helm-package-push` below inlines a fixed copy of
      # `.helm:build-push` while the fix is validated here before being proposed
      # upstream. Restore the `extends` once the catalogue carries it.
      - helm-ci.yml
    ref: main

default:
  image: alpine:latest

variables:
  TAG: "${CI_COMMIT_REF_SLUG}"
  REGISTRY_URL: "${REGISTRY_HOST}/${PROJECT_PATH}"
  # The chart lives at deploy/helm/lisa (deploy/helm/lisa/Chart.yaml), so
  # CHARTS_DIR is "deploy/helm" - chart-testing treats each subdirectory of a
  # chart-dir that holds a Chart.yaml as a chart.
  CHARTS_DIR: deploy/helm

stages:
  - read-secret
  - docker-build
  - helm-package

read_secret:
  stage: read-secret
  extends:
    - .vault:read_secret

.docker-build-common:
  stage: docker-build
  extends:
    - .kaniko:build-push
  variables:
    IMAGE_NAMES: ""  # Overridden in before_script
    EXTRA_BUILD_ARGS: "--build-arg DOCKERHUB_MIRROR_URL=${DOCKERHUB_MIRROR_URL}"
  rules:
    - when: always

docker-build-backend:
  extends:
    - .docker-build-common
  variables:
    DOCKERFILE: "backend/Dockerfile"
    WORKING_DIR: "backend"
  before_script:
    - |
      SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      # The DSO mirror only ever syncs branches, never tags (see dso-auto-sync.yaml),
      # so this pipeline never runs as a GitLab tag pipeline and $CI_COMMIT_TAG is
      # always empty here. appVersion is the app version bump/release-please already
      # committed to Chart.yaml before the sync ran - same source of truth
      # helm-package-push below reads for the chart's own version.
      APP_VERSION=$(grep '^appVersion:' deploy/helm/lisa/Chart.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$APP_VERSION" ]; then
        echo "Error: Could not extract appVersion from deploy/helm/lisa/Chart.yaml"
        exit 1
      fi
      TAGS="lisa/backend:$SHORT_SHA"
      TAGS="$TAGS lisa/backend:$CI_COMMIT_REF_SLUG"
      TAGS="$TAGS lisa/backend:$APP_VERSION"
      if echo "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        TAGS="$TAGS lisa/backend:latest"
      fi
      export IMAGE_NAMES="$TAGS"
      echo "Building with tags: $IMAGE_NAMES"

