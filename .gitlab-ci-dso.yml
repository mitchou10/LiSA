include:
  - project: $CATALOG_PATH
    file: vault-ci.yml
    ref: main
  - project: $CATALOG_PATH
    file: kaniko-ci.yml
    ref: main

default:
  image: alpine:latest

variables:
  TAG: "${CI_COMMIT_REF_SLUG}"
  REGISTRY_URL: "${REGISTRY_HOST}/${PROJECT_PATH}"

stages:
  - read-secret
  - docker-build

read_secret:
  stage: read-secret
  extends:
    - .vault:read_secret

docker-lisa-guard-worker:
  variables:
    WORKING_DIR: .
    IMAGE_NAMES:  lisa-guard-worker:${CI_COMMIT_REF_SLUG} lisa-guard-worker:${CI_COMMIT_SHORT_SHA} # lisa-guard-worker:${CI_COMMIT_TAG}
    DOCKERFILE: "Dockerfile"
    EXTRA_BUILD_ARGS: "--target guard"
  stage: docker-build
  extends:
    - .kaniko:build-push


docker-lisa-analyser-worker:
  variables:
    WORKING_DIR: .
    IMAGE_NAMES:  lisa-analyser-worker:${CI_COMMIT_REF_SLUG} lisa-analyser-worker:${CI_COMMIT_SHORT_SHA} # lisa-analyser-worker:${CI_COMMIT_TAG}
    DOCKERFILE: "Dockerfile"
    EXTRA_BUILD_ARGS: "--target analyser"
  stage: docker-build
  extends:
    - .kaniko:build-push
