[project]
name = "lisa-service-classification"
version = "0.5.0"
description = "LiSA worker service: per-page text classification (single or multi-label) with a swappable zero-shot model, GLiNER2 by default."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "celery[redis]>=5.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "gliner2[local]>=2.1",
    "lisa-worker",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# For local development, resolve the worker package from the sibling folder.
[tool.uv.sources]
lisa-worker = { path = "../../worker", editable = true }
