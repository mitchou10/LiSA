[project]
name = "lisa-service-parser"
version = "0.1.0"
description = "LiSA worker service: document parsing and OCR (LiteParse with Tesseract or PaddleOCR, page orientation) producing page images, text and word bounding boxes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "celery[redis]>=5.4",
    "liteparse>=2.14",
    "boto3>=1.35",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.0",
    "lisa-worker",
]

[project.optional-dependencies]
# OCR_ENGINE=paddleocr: PaddleOCR runs the ONNX models through ONNX Runtime
# (PaddlePaddle itself is not installed).
paddle = [
    "paddleocr>=3.7.0",
    "onnxruntime>=1.20.0",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "reportlab>=4.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# For local development, resolve the worker package from the sibling folder.
[tool.uv.sources]
lisa-worker = { path = "../../worker", editable = true }
