[project]
name = "lisa-service-anonymize"
version = "1.2.0"
description = "LiSA worker service: PII anonymization via llm-guard's Anonymize scanner, exposed as a Celery task."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "boto3>=1.43.111",
    "pillow>=10.1",
    "lisa-worker",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# For local development, resolve the worker package from the sibling folder.
[tool.uv.sources]
lisa-worker = { path = "../../worker", editable = true }
