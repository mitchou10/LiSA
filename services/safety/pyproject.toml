[project]
name = "lisa-service-safety"
version = "0.1.0"
description = "LiSA worker service: prompt injection, toxicity, and secrets detection via llm-guard."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "llm-guard>=0.3.16",
    "lisa-worker",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# For local development, resolve the worker package from the sibling folder.
[tool.uv.sources]
lisa-worker = { path = "../../worker", editable = true }
