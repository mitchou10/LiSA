[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5.7",
    "loguru>=0.7.3",
]

[dependency-groups]
analyser = [
    "transformers>=4.51.3",
]
guard = [
    "llm-guard>=0.3.16",
    "spacy>=3.8.7",
    "torch>=2.8.0",
]
tests = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
