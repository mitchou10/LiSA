{{- if .Values.enabled }}
{{- if eq .Values.classification.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "classification") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "classification")) | nindent 4 }}
spec:
  {{- if not .Values.classification.autoscaling.enabled }}
  replicas: {{ .Values.classification.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.classification.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "classification") | nindent 6 }}
  strategy:
    type: {{ .Values.classification.strategy.type }}
    {{- if eq .Values.classification.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.classification.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.classification.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "classification" "component" .Values.classification) | nindent 4 }}
{{- end }}
{{- end }}
