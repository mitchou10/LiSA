{{- if .Values.enabled }}
{{- if eq .Values.classification.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "classification") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "classification") | nindent 4 }}
spec:
  {{- if not .Values.classification.autoscaling.enabled }}
  replicas: {{ .Values.classification.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.classification.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "classification") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "classification") }}
  {{- with .Values.classification.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "classification" "component" .Values.classification) | nindent 4 }}
  {{- if or .Values.classification.volumeClaims .Values.classification.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.classification.volumeClaims) (default (list) .Values.classification.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
