{{- if .Values.enabled }}
{{- if .Values.ner.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "ner") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "ner")) | nindent 4 }}
  {{- if .Values.ner.networkPolicy.labels }}
    {{- toYaml .Values.ner.networkPolicy.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.ner.networkPolicy.annotations }}
  annotations: {{- toYaml .Values.ner.networkPolicy.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- /* Required: an omitted podSelector defaults to `{}`, which would apply these rules to EVERY
  pod in the release namespace instead of just this component's pods. */}}
  podSelector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "ner") | nindent 6 }}
  policyTypes: {{- toYaml .Values.ner.networkPolicy.policyTypes | nindent 2 }}
  {{- with .Values.ner.networkPolicy.ingress }}
  ingress: {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .Values.ner.networkPolicy.egress }}
  egress: {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
