{{- if .Values.enabled }}
{{- if eq .Values.ner.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "ner") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "ner") | nindent 4 }}
spec:
  {{- if not .Values.ner.autoscaling.enabled }}
  replicas: {{ .Values.ner.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.ner.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "ner") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "ner") }}
  {{- with .Values.ner.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "ner" "component" .Values.ner) | nindent 4 }}
  {{- if or .Values.ner.volumeClaims .Values.ner.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.ner.volumeClaims) (default (list) .Values.ner.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
