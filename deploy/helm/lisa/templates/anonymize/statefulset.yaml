{{- if .Values.enabled }}
{{- if eq .Values.anonymize.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "anonymize") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "anonymize") | nindent 4 }}
spec:
  {{- if not .Values.anonymize.autoscaling.enabled }}
  replicas: {{ .Values.anonymize.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.anonymize.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "anonymize") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "anonymize") }}
  {{- with .Values.anonymize.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "anonymize" "component" .Values.anonymize) | nindent 4 }}
  {{- if or .Values.anonymize.volumeClaims .Values.anonymize.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.anonymize.volumeClaims) (default (list) .Values.anonymize.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
