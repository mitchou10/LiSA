{{- if .Values.enabled }}
{{- /* Not gated on `deploymentType`: every supported kind (Deployment/StatefulSet/DaemonSet) can
sit behind a Service, and `service.enabled` is the switch for components that take no traffic.
This matches metrics.yaml, which is gated the same way. */ -}}
{{- if .Values.anonymize.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "anonymize") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "anonymize")) | nindent 4 }}
spec:
  type: {{ .Values.anonymize.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.anonymize.service.port | default 80 }}
    targetPort: {{ .Values.anonymize.containerPortName | default .Values.anonymize.containerPort | default 8080 }}
    protocol: {{ .Values.anonymize.service.protocol | default "TCP" }}
    {{- if and (eq .Values.anonymize.service.type "NodePort") .Values.anonymize.service.nodePort }}
    nodePort: {{ .Values.anonymize.service.nodePort }}
    {{- end }}
    name: {{ .Values.anonymize.service.portName | default "http" }}
  {{- if .Values.anonymize.service.extraPorts -}}
  {{- toYaml .Values.anonymize.service.extraPorts | nindent 2 -}}
  {{- end }}
  selector: {{- include "helper.selectorLabels" (dict "root" . "componentName" "anonymize") | nindent 4 }}
{{- end }}
{{- end }}
