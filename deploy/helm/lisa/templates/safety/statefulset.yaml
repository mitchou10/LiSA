{{- if .Values.enabled }}
{{- if eq .Values.safety.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "safety") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "safety") | nindent 4 }}
spec:
  {{- if not .Values.safety.autoscaling.enabled }}
  replicas: {{ .Values.safety.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.safety.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "safety") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "safety") }}
  {{- with .Values.safety.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "safety" "component" .Values.safety) | nindent 4 }}
  {{- if or .Values.safety.volumeClaims .Values.safety.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.safety.volumeClaims) (default (list) .Values.safety.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
