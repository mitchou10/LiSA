{{- if .Values.enabled }}
{{- if and .Values.safety.serviceAccount.enabled .Values.safety.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.safety.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "safety")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "safety")) | nindent 4 }}
  {{- if .Values.safety.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.safety.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.safety.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
