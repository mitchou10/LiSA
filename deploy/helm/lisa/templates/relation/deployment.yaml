{{- if .Values.enabled }}
{{- if eq .Values.relation.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "relation") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "relation")) | nindent 4 }}
spec:
  {{- if not .Values.relation.autoscaling.enabled }}
  replicas: {{ .Values.relation.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.relation.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "relation") | nindent 6 }}
  strategy:
    type: {{ .Values.relation.strategy.type }}
    {{- if eq .Values.relation.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.relation.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.relation.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "relation" "component" .Values.relation) | nindent 4 }}
{{- end }}
{{- end }}
