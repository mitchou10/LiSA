{{- if .Values.enabled }}
{{- if eq .Values.relation.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "relation") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "relation") | nindent 4 }}
spec:
  {{- if not .Values.relation.autoscaling.enabled }}
  replicas: {{ .Values.relation.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.relation.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "relation") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "relation") }}
  {{- with .Values.relation.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "relation" "component" .Values.relation) | nindent 4 }}
  {{- if or .Values.relation.volumeClaims .Values.relation.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.relation.volumeClaims) (default (list) .Values.relation.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
