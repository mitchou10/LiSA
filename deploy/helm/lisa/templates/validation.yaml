{{- /*
Values validation only - this template intentionally renders no resource. It exists so
`helper.component.validate` runs on every `helm template`/`helm lint`/`helm install`, including
for combinations where the workload templates themselves would render nothing (e.g. an unknown
`deploymentType`, which would otherwise silently produce a release with no workload at all).
Iterates over `helper.componentNames` - add the new component there when you add one to this
chart, instead of adding an `include` line here.
*/ -}}
{{- if .Values.enabled }}
{{- range $name := include "helper.componentNames" . | fromYamlArray }}
{{- include "helper.component.validate" (dict "name" $name "component" (include "helper.component.values" (dict "root" $ "name" $name) | fromYaml)) }}
{{- end }}
{{- end }}
