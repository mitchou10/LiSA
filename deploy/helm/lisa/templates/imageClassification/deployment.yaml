{{- if .Values.enabled }}
{{- if eq .Values.imageClassification.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "imageClassification") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "imageClassification")) | nindent 4 }}
spec:
  {{- if not .Values.imageClassification.autoscaling.enabled }}
  replicas: {{ .Values.imageClassification.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.imageClassification.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "imageClassification") | nindent 6 }}
  strategy:
    type: {{ .Values.imageClassification.strategy.type }}
    {{- if eq .Values.imageClassification.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.imageClassification.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.imageClassification.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "imageClassification" "component" .Values.imageClassification) | nindent 4 }}
{{- end }}
{{- end }}
