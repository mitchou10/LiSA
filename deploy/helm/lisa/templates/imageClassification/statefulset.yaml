{{- if .Values.enabled }}
{{- if eq .Values.imageClassification.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "imageClassification") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "imageClassification") | nindent 4 }}
spec:
  {{- if not .Values.imageClassification.autoscaling.enabled }}
  replicas: {{ .Values.imageClassification.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.imageClassification.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "imageClassification") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "imageClassification") }}
  {{- with .Values.imageClassification.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "imageClassification" "component" .Values.imageClassification) | nindent 4 }}
  {{- if or .Values.imageClassification.volumeClaims .Values.imageClassification.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.imageClassification.volumeClaims) (default (list) .Values.imageClassification.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
