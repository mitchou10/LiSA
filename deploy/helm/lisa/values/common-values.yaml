fullnameOverride: lisa

global:
  # Project name: Harbor project of the images (<project>/lisa-<service>) and Vault KV mount.
  project: exploration
  vault:
    # Environment prefix: secrets live at <project>/<env>/lisa/<name>
    env: dev
  # One Ingress for the whole application: `/api` goes to the backend, everything else to the frontend.
  # The real host (and `tls`) belong to the environment file; `whitelist` (a list of CIDRs, from the
  # shared `ipwhitelist.yaml`) restricts the source addresses, any address when it is empty.
  ingress:
    enabled: true
    annotations:
      monitor: enabled
      nginx.ingress.kubernetes.io/whitelist-source-range: '{{ .Values.whitelist | join "," | default "0.0.0.0/0" }}'
      # No size limit on a request body (nginx-ingress defaults to 1 MB, which refused any file
      # upload past that with a 413): LiSA bounds what an upload is itself, backend-side. Streamed
      # to the backend rather than buffered whole by the proxy, with time for a large upload.
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      k8s.apisix.apache.org/allowlist-source-range: '{{ .Values.whitelist | join "," | default "0.0.0.0/0" }}'
    hosts:
    - name: "lisa.example.org"
      paths:
      - path: "/api"
        pathType: "Prefix"
        backend:
          serviceName: "lisa-backend"
          portNumber: 8000
      - path: "/"
        pathType: "Prefix"
        backend:
          serviceName: "lisa-frontend"
          portNumber: 8080
  imagePullSecrets:
  - name: "registry-pull-secret"

backend:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-backend"
    pullPolicy: "Always"
  replicaCount: 2
  # FastAPI/uvicorn listens on 8000, not the chart default 8080. Without this override the
  # probes hit 8080 (connection refused) and the Service targetPort is wrong too.
  containerPort: 8000
  # The chart defines probes with `port: *backendContainerPort` (a YAML anchor resolved to 8080
  # at parse time). Overriding containerPort above does NOT change the anchor, so the probes
  # still hit 8080. We must re-declare the probes with the correct port. Paths and timings are
  # copied verbatim from the chart defaults (values.yaml).
  probes:
    # All probes use /health (checks redis, db).
    startupProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 0
      successThreshold: 1
      failureThreshold: 10
      periodSeconds: 10
      timeoutSeconds: 5
    # readinessProbe/livenessProbe use /health - traffic is only routed to the backend
    # once all dependencies are healthy, and the pod is restarted if it becomes unhealthy.
    readinessProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 10
      successThreshold: 2
      failureThreshold: 2
      periodSeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 30
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 5
  service:
    enabled: true
    port: 8000
  serviceAccount:
    enabled: true
    create: true
  envFrom:
  - secretRef:
      name: "lisa-s3"
  - secretRef:
      name: "lisa-keycloak"
  - secretRef:
      name: "lisa-redis"
  # Listed last: envFrom's later-source-wins rule guarantees this computed DATABASE_URL is what
  # actually lands in the container even if another secret above ever grows a stray field of the
  # same name.
  - secretRef:
      name: "lisa-db-infos"
  # Plain (non-secret) app config - see backend/app/config.py for the full settings contract.
  # URLs are computed from the ingress host to avoid duplication - the backend builds
  # redirect_uri, OIDC endpoints, etc. from these two values.
  env:
    # Computed from global.ingress.hosts[0].name at deploy time via Helm template.
    # Backend uses these to build redirect_uri (/api/v1/auth/callback) and post-logout redirects.
    BACKEND_PUBLIC_URL: "https://{{ (index .Values.global.ingress.hosts 0).name }}"
    FRONTEND_URL: "https://{{ (index .Values.global.ingress.hosts 0).name }}"
    # All Keycloak config comes from Vault (lisa-keycloak secret) - no duplication here.
    SESSION_COOKIE_SECURE: "true"
    LOG_LEVEL: "INFO"
  # Non-sensitive config that can vary by env (models, regions, thresholds).
  envCm:
    S3_REGION: "us-east-1"

# Anonymize service (services/anonymize) - Celery worker on the llm-guard-anonymize queue.
# Uses llm-guard to detect and redact PII from text before it reaches the LLM.
anonymize:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-anonymize"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  # Probes disabled: the chart default uses `celery inspect ping` exec probes, but these
  # can cause false-positive restarts under load (the inspect call itself can timeout when
  # the worker is busy processing a long task). KEDA on queue length is the real liveness
  # signal here - if the queue drains, the worker is healthy by definition.
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "lisa-s3"
  - secretRef:
      name: "lisa-redis"
  env:
    # Internal cluster URL - uses the Service DNS, computed from release name.
    LISA_API_URL: "http://{{ include \"helper.fullname\" . }}-backend:8000"
    CELERY_QUEUE: "llm-guard-anonymize"
  envCm:
    AWS_S3_REGION: "us-east-1"

# Safety service (services/safety) - Celery worker on the safety queue.
# Uses GLiNER2 Guardrails to classify text for PII and harmful content.
safety:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-safety"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "lisa-redis"
  env:
    LISA_API_URL: "http://{{ include \"helper.fullname\" . }}-backend:8000"
    CELERY_QUEUE: "safety"
    SAFETY_MODEL: "fastino/GLiNER2-Guardrails-PII-Multi"

# NER service (services/ner) - Celery worker on the ner queue.
# Named entity extraction using GLiNER2.5 multilingual.
ner:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-ner"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "lisa-redis"
  env:
    LISA_API_URL: "http://{{ include \"helper.fullname\" . }}-backend:8000"
    CELERY_QUEUE: "ner"
    NER_MODEL: "fastino/gliner2.5-multi-v1"
    NER_THRESHOLD: "0.5"

# Relation service (services/relation) - Celery worker on the relation queue.
# Relation extraction between named entities using GLiNER2.5.
relation:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-relation"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "lisa-redis"
  env:
    LISA_API_URL: "http://{{ include \"helper.fullname\" . }}-backend:8000"
    CELERY_QUEUE: "relation"
    RELATION_MODEL: "fastino/gliner2.5-multi-v1"
    RELATION_THRESHOLD: "0.5"

# Classification service (services/classification) - Celery worker on the classification queue.
# Multi-label text classification using GLiNER2.5.
classification:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-classification"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "lisa-redis"
  env:
    LISA_API_URL: "http://{{ include \"helper.fullname\" . }}-backend:8000"
    CELERY_QUEUE: "classification"
    CLASSIFIER_BACKEND: "gliner2"
    CLASSIFIER_MODEL: "fastino/gliner2.5-multi-v1"

# Image classification service (services/image-classification) - Celery worker on the
# image-classification queue. Uses CLIP to classify page screenshots.
# Reads images from S3 (RustFS), hence lisa-s3.
imageClassification:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-image-classification"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "lisa-s3"
  - secretRef:
      name: "lisa-redis"
  env:
    LISA_API_URL: "http://{{ include \"helper.fullname\" . }}-backend:8000"
    CELERY_QUEUE: "image-classification"
  envCm:
    IMAGE_MODEL: "openai/clip-vit-base-patch32"
    S3_REGION: "us-east-1"

# Parser service (services/parser) - Celery worker on the liteparse-ocr queue.
# OCR + text extraction from uploaded files, writes page screenshots to S3.
# Reads source files from and writes screenshots to S3 (RustFS), hence lisa-s3.
parser:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-parser"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "lisa-s3"
  - secretRef:
      name: "lisa-redis"
  env:
    LISA_API_URL: "http://{{ include \"helper.fullname\" . }}-backend:8000"
    CELERY_QUEUE: "liteparse-ocr"
  envCm:
    OCR_LANGUAGE: "eng+fra"
    S3_REGION: "us-east-1"

jobs:
  migration:
    # `pre-install` would run before the CNPG cluster exists, so the wait-for-postgres init
    # container below could never succeed on a fresh install (deadlock until the Helm timeout).
    # On install the migration therefore runs after the resources are created (`post-install`);
    # on upgrade the cluster already exists, so it still runs first (`pre-upgrade`) and the new
    # code never starts on an old schema.
    hook:
      enabled: true
      types:
      - "post-install"
      - "post-upgrade"
      weight: 0
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      registry: "harbor.sdid.cpin.numerique-interieur.com"
      repository: "{{ .Values.global.project }}/lisa-backend"
      # The tag defaults to the chart's appVersion (a fixed release), so the image does not need
      # to be pulled again on every run.
      pullPolicy: "IfNotPresent"
    command: ["alembic"]
    args: ["upgrade", "head"]
    envFrom:
    - secretRef:
        name: "lisa-db-infos"
    serviceAccount:
      enabled: true
      create: true
    # A failed migration is retried at most twice, and a stuck one is stopped after 15 minutes
    # instead of blocking the release until the Helm timeout.
    backoffLimit: 2
    activeDeadlineSeconds: 900
    initContainers:
    - name: wait-for-postgres
      # Same image as the migration itself (Harbor, already pulled): no dependency on docker.io,
      # which is unreachable from restricted environments and left the pod stuck in
      # `PodInitializing`. Polls the TCP port every second; alembic then fails fast if
      # PostgreSQL is not really ready.
      image: "harbor.sdid.cpin.numerique-interieur.com/{{ .Values.global.project }}/lisa-backend:{{ .Chart.AppVersion }}"
      imagePullPolicy: "IfNotPresent"
      command:
      - "python"
      - "-c"
      - |-
        import os,socket,time
        from urllib.parse import urlsplit
        u = urlsplit(os.environ['DATABASE_URL'])
        print(f'Waiting for PostgreSQL at {u.hostname}:{u.port or 5432}', flush=True)
        while True:
            try:
                socket.create_connection((u.hostname, u.port or 5432), 2).close()
                break
            except OSError:
                time.sleep(1)
        print('PostgreSQL reachable', flush=True)
      # Same secret as the migration: waits on the host alembic will really use (and logs it - no credentials).
      envFrom:
      - secretRef:
          name: "lisa-db-infos"
      securityContext:
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: "RuntimeDefault"
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
    resources:
      limits:
        cpu: "500m"
        memory: "256Mi"
      requests:
        cpu: "250m"
        memory: "128Mi"

frontend:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/lisa-frontend"
    pullPolicy: "Always"
  replicaCount: 2
  service:
    enabled: true
    port: 8080
  serviceAccount:
    enabled: true
    create: true
  # nginx-unprivileged listens on 8080, not the chart default 80.
  containerPort: 8080
  # The chart defines probes with `port: *frontendContainerPort` (a YAML anchor). Overriding
  # containerPort above does NOT change the anchor, so the probes still hit the wrong port.
  # We must re-declare the probes with the correct port.
  probes:
    startupProbe:
      httpGet:
        path: "/"
        port: 8080
      initialDelaySeconds: 0
      successThreshold: 1
      failureThreshold: 10
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: "/"
        port: 8080
      initialDelaySeconds: 10
      successThreshold: 2
      failureThreshold: 2
      periodSeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: "/"
        port: 8080
      initialDelaySeconds: 30
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 5

redis:
  fullnameOverride: lisa-redis
  auth:
    existingSecret: "lisa-redis"
    existingSecretPasswordKey: "REDIS_PASSWORD"
  # The chart's generated redis.conf has no `dir` directive, so redis defaults to CWD (/).
  # With readOnlyRootFilesystem: true (chart default), RDB snapshots fail with
  # "MISCONF Redis is configured to save RDB snapshots, but it's currently unable to persist
  # to disk." Point `dir` at the persistent volume mount (/data) so dump.rdb lands on the PVC.
  config:
    content: |
      # Redis configuration
      bind * -::*
      dir /data
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# The namespace quota (dso-quota) rejects any pod without requests/limits.
rustfs:
  # Root credentials come from the same Vault secret the components use to reach RustFS,
  # so both sides always agree.
  auth:
    existingSecret: "lisa-s3"
    existingSecretAccessKeyKey: "S3_ACCESS_KEY"
    existingSecretSecretKeyKey: "S3_SECRET_KEY"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

cnpg:
  enabled: true
  fullnameOverride: "lisa-pg-cluster"
  mode: "standalone"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.7"
    # The namespace quota (dso-quota) rejects any pod without requests/limits. CNPG applies these to
    # every pod of the cluster, including the `initdb` job and its `bootstrap-controller` init
    # container, so they are required for the cluster to bootstrap at all.
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    enableSuperuserAccess: true
    superuserSecret: "lisa-db-superuser"
    initdb:
      database: "lisa"
      owner: "lisa"
      secret:
        name: "lisa-db-appuser"
    monitoring:
      enabled: true
  backups:
    # Required by the cluster chart: without it the whole `backups` block below
    # is silently dropped from the rendered Cluster (no barmanObjectStore at all).
    enabled: true
    method: "barmanObjectStore"
    endpointURL: "https://s3.fr-par.scw.cloud"
    provider: "s3"
    s3:
      # Bucket the barman backups are stored in. Required by the cluster chart
      # when `destinationPath` is not set - without it rendering fails with
      # "You need to specify S3 bucket if destinationPath is not specified".
      bucket: "lisa-db-backups"
      path: "/"
    data:
      compression: "gzip"
      encryption: ""
      jobs: 2
    wal:
      compression: "gzip"
      encryption: ""
      maxParallel: 2
    secret:
      create: false
      name: "lisa-db-backups"
  recovery:
    method: "object_store"
    clusterName: "lisa-pg-cluster"
    database: "lisa"
    owner: "lisa"
    endpointURL: "https://s3.fr-par.scw.cloud"
    provider: "s3"
    secret:
      create: false
      name: "lisa-db-backups"
  replica:
    bootstrap:
      source: "object_store"
      database: "lisa"
      owner: "lisa"
    origin:
      objectStore:
        clusterName: "lisa-pg-cluster"
        endpointURL: "https://s3.fr-par.scw.cloud"
        provider: "s3"
        secret:
          create: false
          name: "lisa-db-backups"

extraObjects:
  lisa-s3:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: lisa-s3
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/lisa/s3'
      type: kv-v2
      destination:
        name: lisa-s3
        create: true
  lisa-keycloak:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: lisa-keycloak
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/lisa/keycloak'
      type: kv-v2
      destination:
        name: lisa-keycloak
        create: true
  lisa-redis:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: lisa-redis
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/lisa/redis'
      type: kv-v2
      destination:
        name: lisa-redis
        create: true
        # Keeps the raw REDIS_PASSWORD (used by the redis chart's own `auth.existingSecret`
        # above) and adds a computed REDIS_URL for the app's envFrom - single Vault path serves
        # both. Assumes the Vault-stored password has no URL-reserved characters.
        transformation:
          templates:
            REDIS_URL:
              text: 'redis://:{{ "{{" }} get .Secrets "REDIS_PASSWORD" {{ "}}" }}@lisa-redis:6379/0'
  lisa-db-superuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: lisa-db-superuser
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/lisa/db-superuser'
      type: kv-v2
      destination:
        name: lisa-db-superuser
        create: true
        # CNPG requires a kubernetes.io/basic-auth secret (username + password keys)
        # for superuserSecret - an Opaque secret (VSO default) makes the Cluster
        # loop forever waiting for a usable secret.
        type: kubernetes.io/basic-auth
  lisa-db-appuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: lisa-db-appuser
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/lisa/db-appuser'
      type: kv-v2
      destination:
        name: lisa-db-appuser
        create: true
        # CNPG requires a kubernetes.io/basic-auth secret (username + password keys)
        # for initdb.secret - an Opaque secret (VSO default) makes the Cluster
        # loop forever waiting for a usable secret.
        type: kubernetes.io/basic-auth
  lisa-db-infos:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: lisa-db-infos
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/lisa/db-infos'
      type: kv-v2
      destination:
        name: lisa-db-infos
        create: true
        transformation:
          excludes:
          - ".*"
          templates:
            # Host must match `cnpg.fullnameOverride`-rw; port/dbname match `cnpg.cluster.initdb`
            # above. Driver is `postgresql+asyncpg` (backend/app/config.py), not plain
            # `postgresql`. Assumes the Vault-stored password has no URL-reserved
            # characters - if it does, this needs URL-encoding, which VSO templates don't provide.
            DATABASE_URL:
              text: 'postgresql+asyncpg://{{ "{{" }} get .Secrets "username" {{ "}}" }}:{{ "{{" }} get .Secrets "password" {{ "}}" }}@lisa-pg-cluster-rw:5432/lisa'
  lisa-db-backups:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: lisa-db-backups
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/lisa/db-backups'
      type: kv-v2
      destination:
        name: lisa-db-backups
        create: true

  # --- KEDA ScaledObjects (Redis queue length autoscaling for Celery workers) ---
  # The lisa chart has no native KEDA support, so ScaledObjects + TriggerAuthentications are
  # declared here as extraObjects. Each worker has its own Celery queue (listName) and scales
  # independently based on the number of pending messages in its Redis list.
  # KEDA polls the Redis Service directly (not Sentinel-aware). The address MUST be a FQDN
  # (`lisa-redis.<namespace>.svc.cluster.local`), not the short name `lisa-redis`: KEDA runs in
  # its own namespace (`keda-system`) and can't resolve short names from lisa's namespace.
  # The TriggerAuthentication references `lisa-redis` (same Vault-managed secret as the app's
  # envFrom) for the REDIS_PASSWORD - KEDA resolves the Secret by name across namespaces only
  # if the Secret is in the same namespace as the ScaledObject, which is why the ScaledObjects
  # are deployed in lisa's namespace (not keda-system).
  #
  # Per-env overrides (minReplicaCount, maxReplicaCount, pollingInterval, listLength) live
  # in `values-<env>.yaml` under `extraObjects.<name>.spec`.

  # NetworkPolicy: allows the KEDA operator (namespace `keda-system`) to reach the Redis pods
  # on port 6379. Without this, a default-deny namespace policy (common on DSO/managed
  # platforms) silently drops the KEDA scaler's TCP SYN, producing:
  #   "failed to ensure HPA ... dial tcp <redis-ip>:6379: i/o timeout"
  # The DNS resolves (the Service IP is returned) but the connection never completes.
  # KEDA runs in its own namespace, so a namespaceSelector on `kubernetes.io/metadata.name:
  # keda-system` is the most robust match (works regardless of pod labels in keda-system).
  lisa-redis-keda-netpol:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: lisa-redis-allow-keda
    spec:
      # The Redis pods carry the RELEASE name as `instance` (not the service name `lisa-redis`):
      # a selector on `lisa-redis` matches no pod, the allow rule then does nothing, and KEDA's
      # connection still times out.
      podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/instance: "{{ .Release.Name }}"
      policyTypes:
      - Ingress
      ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda-system
        ports:
        - protocol: TCP
          port: 6379

  # TriggerAuthentication: shared by all the worker ScaledObjects.
  lisa-keda-triggerauth:
    apiVersion: keda.sh/v1alpha1
    kind: TriggerAuthentication
    metadata:
      name: lisa-keda-triggerauth
    spec:
      secretTargetRef:
      - parameter: "password"
        name: "lisa-redis"
        key: "REDIS_PASSWORD"

  # ScaledObject for anonymize (queue: llm-guard-anonymize)
  lisa-keda-anonymize:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: lisa-anonymize
    spec:
      scaleTargetRef:
        name: lisa-anonymize
        kind: Deployment
        apiVersion: apps/v1
      minReplicaCount: 1
      maxReplicaCount: 3
      pollingInterval: 30
      triggers:
      - type: redis
        metricType: AverageValue
        metadata:
          address: "lisa-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "llm-guard-anonymize"
          listLength: "5"
        authenticationRef:
          name: lisa-keda-triggerauth

