# -- Master switch for the whole chart. When `false`, every template renders nothing - use this
# to keep a release/namespace registered with a deployment system (e.g. an ArgoCD Application
# that always gets generated for every app/env combination) without actually deploying any
# resource into it. Note this does NOT cover subchart dependencies added via `Chart.yaml` (e.g. a
# bundled database/cache) - those still need their own `enabled: false` alongside this one.
# @section -- General
enabled: true
# -- Provide a name in place of the default application name.
# @section -- General
nameOverride: ""
# -- String to fully override the default application name.
# @section -- General
fullnameOverride: ""
# -- Add labels to all the deployed resources
# @section -- General
commonLabels: {}
global:
  # -- List or map of `configMapRef`/`secretRef` entries to load into every container's
  # `envFrom` (merged with each component's own `envFrom`, global entries first).
  # @section -- Global
  envFrom: []
  # - configMapRef:
  #     name: "my-config"
  # - secretRef:
  #     name: "my-secret"
  #
  # my-config:
  #   configMapRef:
  #     name: "my-config"
  # my-secret:
  #   secretRef:
  #     name: "my-secret"
  # -- Map or array of environment variables to inject into all containers (`valueFrom` supported).
  # @section -- Global
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by all containers (`valueFrom` not supported).
  # @section -- Global
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by all containers (`valueFrom` not supported).
  # @section -- Global
  envSecret: {}
  # E: "E"

  # -- Global Docker image registry
  # @section -- Global
  imageRegistry: ""
  # -- Image credentials applied to every component in addition to any component-specific `imagePullSecrets`.
  # @section -- Global
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  ## Chart-level Ingress, for fanning several components (or several charts) behind one hostname.
  ## Unlike `backend.ingress` it has no default backend, so every path must name the service
  ## it routes to - rendering would otherwise point at a Service that does not exist.
  ingress:
    # -- Whether or not the chart-level ingress should be enabled.
    # @section -- Global
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Global
    className: ""
    # -- Additional ingress annotations.
    # @section -- Global
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Global
    labels: {}
    # -- Hosts and paths served by the chart-level ingress. Each path's `backend.serviceName` is
    # required (see above); `backend.portNumber` defaults to 80.
    # @section -- Global
    hosts: []
    # - name: "domain.local"
    #   paths:
    #   - path: "/"
    #     pathType: "Prefix"
    #     backend:
    #       serviceName: "my-web-service"
    #       portNumber: 80
    #   - path: "/api"
    #     pathType: "Prefix"
    #     backend:
    #       serviceName: "my-api-service"
    #       portNumber: 8080
    # -- TLS configuration for the chart-level ingress.
    # @section -- Global
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Chart-level Gateway API HTTPRoute, same rationale as `global.ingress` above: `rules` and their
  ## `backendRefs[].name` are required because there is no default backend to fall back to.
  httpRoute:
    # -- Whether or not the chart-level HTTPRoute should be enabled.
    # @section -- Global
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Global
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Global
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Global
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: https
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Global
    hostnames: []
    # - "example.com"
    # - "*.example.com"
    # -- Routing rules for the HTTPRoute. Required when `enabled` is true, and every `backendRefs`
    # entry must carry a `name`.
    # @section -- Global
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     queryParams:
    #     - type: Exact
    #       name: "debug"
    #       value: "true"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service
    #     port: 80
    #     weight: 100
## Gateway API configuration (alternative to Ingress)
## Ref: https://gateway-api.sigs.k8s.io/
gateway:
  # -- Create a Gateway resource. Usually, you reference an existing Gateway managed by the infrastructure team.
  # @section -- Global
  create: false
  # -- Name of the Gateway resource. If not set, uses the release fullname.
  # @section -- Global
  name: ""
  # -- GatewayClass name. Required when creating a Gateway.
  # @section -- Global
  className: ""
  # -- Additional gateway annotations.
  # @section -- Global
  annotations: {}
  # -- Additional gateway labels.
  # @section -- Global
  labels: {}
  # -- Gateway addresses configuration.
  # @section -- Global
  addresses: []
  # - type: IPAddress
  #   value: "192.168.1.100"
  # - type: Hostname
  #   value: "gateway.example.com"
  # -- Gateway listeners configuration.
  # @section -- Global
  listeners: []
  # - name: http
  #   port: 80
  #   protocol: HTTP
  #   hostname: "*.example.com"
  #   allowedRoutes:
  #     namespaces:
  #       from: Same  # Same, All, or Selector
  #     kinds:
  #     - kind: HTTPRoute
  # - name: https
  #   port: 443
  #   protocol: HTTPS
  #   hostname: "*.example.com"
  #   tls:
  #     mode: Terminate  # Terminate or Passthrough
  #     certificateRefs:
  #     - kind: Secret
  #       name: example-com-tls
  #   allowedRoutes:
  #     namespaces:
  #       from: Same

# -- Secrets shared by several components (rendered into their `envSecret`). These defaults are
# for local testing only: override them, or reference a Secret you manage through `envFrom`.
# @section -- General
secrets:
  serviceToken: "change-me-service-token"
  keycloakClientSecret: "change-me-keycloak-secret"
  # Credentials of the `lisa` database owner created by the bundled CNPG cluster
  # (`cnpg.cluster.initdb` below). Rendered into the basic-auth secrets the
  # CNPG operator requires (see `extraObjects` below) and into the backend's
  # DATABASE_URL. For local testing only.
  postgresUsername: "lisa"
  postgresPassword: "change-me-postgres"
# -- S3 bucket the files, screenshots and blurred images are stored in (on the bundled RustFS).
# @section -- General
s3:
  bucket: "lisa-files"

# Shared defaults every component below is deep-merged on top of at render time
# (`helper.component.values` in templates/_components.tpl) - the "mold" every component is
# stamped from. A component's own block (e.g. `anonymize:` below) only needs to declare what
# makes it different from this (its image repository, its env vars, non-default resources, ...);
# everything else - probe/ingress/route shape, RBAC switches, PDB/HPA defaults, security
# contexts, etc. - is inherited from here instead of being repeated in every component block.
# @section -- Component Defaults
componentDefaults:
  # -- Workload kind to deploy the app as. One of "Deployment", "StatefulSet" or "DaemonSet"
  # (validated at render time - an unknown value fails instead of producing a release with no
  # workload). Use the top-level `jobs` / `cronjobs` maps for one-off or scheduled workloads.
  # Some values only apply to certain kinds: `replicaCount`/`autoscaling` and `strategy` are
  # Deployment-only (`autoscaling` also works on a StatefulSet), `volumeClaims`/`extraVolumeClaims`
  # are StatefulSet-only, and `updateStrategy` covers StatefulSet and DaemonSet.
  # @section -- Component Defaults
  deploymentType: "Deployment"
  # -- The number of application controller pods to run. Ignored when `deploymentType` is
  # "DaemonSet" (one pod per node) or when `autoscaling.enabled` is true.
  # @section -- Component Defaults
  replicaCount: 1
  image:
    # -- Registry to use for the app.
    # @section -- Component Defaults
    registry: "ghcr.io"
    # -- Repository to use for the app.
    # @section -- Component Defaults
    repository: ""
    # -- Image pull policy for the app.
    # @section -- Component Defaults
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Component Defaults
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    # -- Image digest (`sha256:...`). When set it takes precedence over `tag`, pinning the exact
    # image content so the same release can never resolve to a different build - preferred over a
    # mutable tag for anything you deploy to production.
    # @section -- Component Defaults
    digest: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Component Defaults
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Component Defaults
    className: ""
    # -- Additional ingress annotations.
    # @section -- Component Defaults
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Component Defaults
    labels: {}
    hosts:
      -  # -- Name of the host record.
        # @section -- Component Defaults
        name: "domain.local"
        # -- Paths of the host record to manage routing (avoids repeating the same host for
        # multiple paths/backends).
        # @section -- Component Defaults
        paths:
          -  # -- Path of the host record to manage routing.
            # @section -- Component Defaults
            path: "/"
            # -- Path type of the host record.
            # @section -- Component Defaults
            pathType: "Prefix"
            backend:
              # -- Name of the backend service linked to the path (leave empty to use the app service).
              # @section -- Component Defaults
              serviceName: ""
              # -- Port used by the backend service linked to the path (leave null to use the app service port).
              # @section -- Component Defaults
              portNumber: null
    # -- Enable TLS configuration.
    # @section -- Component Defaults
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Gateway API HTTPRoute configuration (alternative to Ingress)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
  httpRoute:
    # -- Enable an HTTPRoute resource for this service.
    # @section -- Component Defaults
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Component Defaults
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Component Defaults
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Component Defaults
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace  # optional
    #   sectionName: https            # optional, specific listener name
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Component Defaults
    hostnames: []
    # - "example.com"
    # - "api.example.com"
    # -- Routing rules for the HTTPRoute.
    # @section -- Component Defaults
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix     # PathPrefix, Exact, or RegularExpression
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service       # defaults to chart service if not set
    #     port: 80               # defaults to service port if not set
    #     weight: 100            # for traffic splitting
  ## Gateway API GRPCRoute configuration (for gRPC services)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
  grpcRoute:
    # -- Enable a GRPCRoute resource for this service.
    # @section -- Component Defaults
    enabled: false
    # -- Additional GRPCRoute annotations.
    # @section -- Component Defaults
    annotations: {}
    # -- Additional GRPCRoute labels.
    # @section -- Component Defaults
    labels: {}
    # -- Parent references (Gateways) to attach the GRPCRoute to.
    # @section -- Component Defaults
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: grpc
    # -- Hostnames for the GRPCRoute to match.
    # @section -- Component Defaults
    hostnames: []
    # - "grpc.example.com"
    # -- Routing rules for the GRPCRoute.
    # @section -- Component Defaults
    rules: []
    # - matches:
    #   - method:
    #       type: Exact          # Exact or RegularExpression
    #       service: "mypackage.MyService"
    #       method: "MyMethod"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #   backendRefs:
    #   - name: my-grpc-service
    #     port: 50051
    #     weight: 100
  # -- Mount the ServiceAccount token into the app pods. Defaults to false so a compromised
  # container holds no API credentials; the API server does not need the token unless the app
  # actually talks to the Kubernetes API. Applied at pod level so it holds even when
  # `serviceAccount.name` points at an SA that automounts.
  # @section -- Component Defaults
  automountServiceAccountToken: false
  # -- Inject the legacy `{SVC}_SERVICE_HOST`/`_PORT` environment variables for every Service in the
  # namespace. Defaults to false: the variables are rarely used, leak the namespace's topology into
  # every container, and can collide with the app's own configuration. Set to true only for an app
  # that genuinely reads them.
  # @section -- Component Defaults
  enableServiceLinks: false
  # -- Annotations for the app deployed pods.
  # @section -- Component Defaults
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Component Defaults
  podLabels: {}
  # -- Pod-level security context. Defaults to a hardened baseline that satisfies the `restricted`
  # Pod Security Standard. Rendered via `toYaml`, so any `PodSecurityContext` field is accepted.
  # Adjust the UID/GID to whatever your image actually ships with - `runAsNonRoot` makes the
  # kubelet refuse to start a container that would run as root, which is the intended failure mode
  # rather than something to switch off. Set to `null` to omit the block entirely.
  # @section -- Component Defaults
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    # Owns mounted volumes so a non-root container can still write to them.
    fsGroup: 10001
    # Only chown volume contents when the top-level dir doesn't already match, which avoids
    # re-chowning large volumes on every start.
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: "RuntimeDefault"
  # -- Init containers to add to the app pod.
  # @section -- Component Defaults
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Component Defaults
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Anonymize container port number. Set to `null`/`0` (and disable `service`/probes) for
  # components that don't listen on any port (e.g. a queue consumer).
  # @section -- Component Defaults
  containerPort: &anonymizeContainerPort null
  # -- Anonymize container port name.
  # @section -- Component Defaults
  containerPortName: "http"
  # -- Anonymize extra container ports.
  # @section -- Component Defaults
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Anonymize container command.
  # @section -- Component Defaults
  command: []
  # -- Anonymize container command args.
  # @section -- Component Defaults
  args: []
  # -- Container-level security context. Defaults to a hardened baseline that satisfies the
  # `restricted` Pod Security Standard: no privilege escalation, no capabilities, immutable root
  # filesystem. Rendered via `toYaml`, so any `SecurityContext` field is accepted. Note
  # `readOnlyRootFilesystem` requires the app to write only to mounted volumes - the default
  # `volumes`/`volumeMounts` below provide an `emptyDir` on /tmp for that reason. Set to `null` to
  # omit the block entirely.
  # @section -- Component Defaults
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - "ALL"
  # -- Anonymize container env variables loaded from configmap or secret reference. List or map
  # (merged with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
  # @section -- Component Defaults
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Map or array of environment variables to inject into the app container (`valueFrom` supported).
  # @section -- Component Defaults
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by the app container (`valueFrom` not supported).
  # @section -- Component Defaults
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by the app container (`valueFrom`
  # not supported). Values placed here are stored in plain text in the values file AND in the Helm
  # release secret, so use it for non-sensitive-but-secret-shaped config only. For real credentials
  # prefer referencing a Secret you manage elsewhere via `envFrom`, or have an operator materialise
  # it (see the `VaultStaticSecret` example under `extraObjects`).
  # @section -- Component Defaults
  envSecret: {}
  # E: "E"
  probes:
    startupProbe:
      exec: &anonymizeWorkerPing
        command: ["sh", "-c", "celery -A app.celery_app.celery_app inspect ping -d celery@$HOSTNAME"]
      initialDelaySeconds: 30
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 20
    livenessProbe:
      exec:
        command: ["sh", "-c", "celery -A app.celery_app.celery_app inspect ping -d celery@$HOSTNAME"]
      initialDelaySeconds: 60
      failureThreshold: 3
      periodSeconds: 60
      timeoutSeconds: 20
    # A queue consumer takes no traffic: readiness has no meaning.
    readinessProbe: null
  ## Deployment-only. StatefulSet and DaemonSet use `updateStrategy` below - their update
  ## strategies are a different API shape (no `Recreate`, and different `rollingUpdate` fields),
  ## so they are kept as separate values rather than one block that means three different things.
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # Only applied when `deploymentType` is "Deployment".
    # @section -- Component Defaults
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Component Defaults
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Component Defaults
      maxSurge: 1
  # -- Update strategy applied when `deploymentType` is "StatefulSet" or "DaemonSet" (ignored for
  # a Deployment, which uses `strategy` above). Rendered verbatim via `toYaml`, so it takes the
  # native `StatefulSetUpdateStrategy`/`DaemonSetUpdateStrategy` shape of the selected kind; left
  # empty, Kubernetes applies its own default (`RollingUpdate` for both).
  # @section -- Component Defaults
  updateStrategy: {}
  # StatefulSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     partition: 0
  #     maxUnavailable: 1
  # DaemonSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     maxUnavailable: 1
  #     maxSurge: 0
  # -- Image credentials configuration.
  # @section -- Component Defaults
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  ## Node-level pod settings. Mostly relevant when `deploymentType` is "DaemonSet" (node agents,
  ## log/metric collectors), but valid for every kind.
  # -- Share the host network namespace. Container ports then bind directly on the node, so they
  # must not collide with anything else running there.
  # @section -- Component Defaults
  hostNetwork: false
  # -- Share the host PID namespace (lets the container see and signal host processes).
  # @section -- Component Defaults
  hostPID: false
  # -- Pod DNS policy. Left empty, it defaults to `ClusterFirstWithHostNet` when `hostNetwork` is
  # true (otherwise a hostNetwork pod silently stops resolving cluster DNS) and to the Kubernetes
  # default `ClusterFirst` when it isn't.
  # @section -- Component Defaults
  # @default -- `""` (`ClusterFirstWithHostNet` when `hostNetwork` is true)
  dnsPolicy: ""
  # -- Pod DNS configuration, merged with `dnsPolicy` by the kubelet.
  # @section -- Component Defaults
  dnsConfig: {}
  # nameservers:
  # - "1.1.1.1"
  # options:
  # - name: "ndots"
  #   value: "2"
  # searches:
  # - "my.dns.search.suffix"
  # -- PriorityClass to schedule the pods with (e.g. `system-node-critical` for a node agent that
  # must not be evicted under pressure).
  # @section -- Component Defaults
  priorityClassName: ""
  # -- (int) Grace period, in seconds, given to the pod to shut down cleanly before it is killed.
  # @section -- Component Defaults
  # @default -- `null` (Kubernetes default of 30)
  terminationGracePeriodSeconds: null
  # -- Topology spread constraints used to spread the pods across failure domains.
  # @section -- Component Defaults
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: "topology.kubernetes.io/zone"
  #   whenUnsatisfiable: "ScheduleAnyway"
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: "helm-frontend"
  # -- Host aliases that will be injected at pod-level into /etc/hosts.
  # @section -- Component Defaults
  hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.1.2.3"
  #   hostnames:
  #   - "foo.remote"
  #   - "bar.remote"
  # -- List of volumes to add. Prefer this for volumes the chart itself always needs (e.g.
  # security-hardening `emptyDir`s); use `extraVolumes` below for anything you add on top, so
  # overriding one doesn't require repeating the other. Defaults to a `/tmp` `emptyDir`, which is
  # what makes the default `securityContext.readOnlyRootFilesystem: false` usable - drop it only if
  # you also relax that. Helm replaces lists wholesale rather than merging them, so overriding this
  # key means restating the entries you want to keep.
  # @section -- Component Defaults
  volumes:
    - name: "tmp"
      emptyDir: {}
  # - name: config-volume
  #   configMap:
  #     name: log-config
  #     items:
  #       - key: log_level
  #         path: log_level.conf
  # - name: cache-volume
  #   emptyDir:
  #     sizeLimit: 500Mi
  # - name: image-volume
  #   image:
  #     reference: quay.io/crio/artifact:v2
  #     pullPolicy: IfNotPresent
  # -- Additional volumes to add, concatenated with `volumes` above at render time (e.g. to
  # mount a cert or config from a values override without repeating the chart's own volumes).
  # @section -- Component Defaults
  extraVolumes: []
  # - name: certs
  #   secret:
  #     secretName: my-tls-cert
  # -- List of volumeClaims to add, rendered as the StatefulSet's `volumeClaimTemplates`. Requires
  # `deploymentType: "StatefulSet"` - setting it on a Deployment or DaemonSet fails at render time
  # rather than being silently dropped (use `volumes`/`extraVolumes` there instead).
  # @section -- Component Defaults
  volumeClaims: []
  # - metadata:
  #     name: app-volume
  #   spec:
  #     accessModes: [ "ReadWriteOnce" ]
  #     storageClassName: "my-storage-class"
  #     resources:
  #       requests:
  #         storage: 1Gi
  # -- Additional volumeClaims to add, concatenated with `volumeClaims` above at render time.
  # @section -- Component Defaults
  extraVolumeClaims: []
  # -- List of mounts to add (normally used with `volumes` or `volumeClaims`). Prefer this for
  # mounts the chart itself always needs; use `extraVolumeMounts` below for anything you add
  # on top, so overriding one doesn't require repeating the other. Defaults to the `/tmp` mount
  # backing the hardened `readOnlyRootFilesystem` default (see `volumes` above).
  # @section -- Component Defaults
  volumeMounts:
    - name: "tmp"
      mountPath: "/tmp"
  # - name: config-volume
  #   mountPath: /app/config
  #   subPath: config
  #   readOnly: true
  #   mountPropagation: None
  #   recursiveReadOnly: Enabled
  # - name: cache-volume
  #   mountPath: /app/cache
  # - name: image-volume
  #   mountPath: /app/content
  # - name: storage-volume
  #   mountPath: /app/storage
  # -- Additional volumeMounts to add, concatenated with `volumeMounts` above at render time.
  # @section -- Component Defaults
  extraVolumeMounts: []
  # - name: certs
  #   mountPath: /etc/certs
  #   readOnly: true
  service:
    # -- Whether or not to create a Service for the app (a queue consumer takes no traffic).
    # @section -- Component Defaults
    enabled: false
    # -- Type of service to create for the app.
    # @section -- Component Defaults
    type: "ClusterIP"
    # -- Port used by the service.
    # @section -- Component Defaults
    port: 80
    # -- (int) Port used when type is `NodePort` to expose the service on the given node port. Left
    # empty, Kubernetes allocates one from the configured node-port range, which avoids two
    # releases of this chart colliding on the same hardcoded port.
    # @section -- Component Defaults
    # @default -- `null` (allocated by Kubernetes)
    nodePort: null
    # -- Port name used by the service.
    # @section -- Component Defaults
    portName: "http"
    # -- Protocol used by the service.
    # @section -- Component Defaults
    protocol: "TCP"
    # -- Extra service ports.
    # @section -- Component Defaults
    extraPorts: []
    # - port: 9090
    #   targetPort: 9090
    #   protocol: "TCP"
    #   name: "metrics"
  resources:
    requests:
      # -- Memory request for the app.
      # @section -- Component Defaults
      memory: "1Gi"
      # -- CPU request for the app.
      # @section -- Component Defaults
      cpu: "2"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "100Mi"
    limits:
      # -- Memory limit for the app.
      # @section -- Component Defaults
      memory: "4Gi"
      # -- CPU limit for the app.
      # @section -- Component Defaults
      cpu: "2"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "500Mi"
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler for the app.
    # @section -- Component Defaults
    enabled: false
    # -- Minimum number of replicas for the app.
    # @section -- Component Defaults
    minReplicas: 1
    # -- Maximum number of replicas for the app.
    # @section -- Component Defaults
    maxReplicas: 3
    # -- Average CPU utilization percentage for the app.
    # @section -- Component Defaults
    targetCPUUtilizationPercentage: 80
    # -- Average memory utilization percentage for the app.
    # @section -- Component Defaults
    targetMemoryUtilizationPercentage: 80
  # -- Revision history limit for the app.
  # @section -- Component Defaults
  revisionHistoryLimit: 10
  # -- Default node selector for app.
  # @section -- Component Defaults
  nodeSelector: {}
  # kubernetes.io/os: "linux"
  # kubernetes.io/arch: "amd64"
  # kubernetes.io/hostname: "node1"
  # -- Default tolerations for app.
  # @section -- Component Defaults
  tolerations: []
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  #   tolerationSeconds: 3600
  # - key: "key2"
  #   operator: "Equal"
  #   value: "value2"
  #   effect: "NoExecute"
  #   tolerationSeconds: 3600
  # - key: "key3"
  #   operator: "Exists"
  #   effect: "PreferNoSchedule"
  #   tolerationSeconds: 3600
  # -- Affinity used for app pod.
  # @section -- Component Defaults
  affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions:
  #       - key: "app.kubernetes.io/name"
  #         operator: "In"
  #         values:
  #         - "helm-frontend"
  #     topologyKey: "kubernetes.io/hostname"
  serviceAccount:
    # -- Enable the service account.
    # @section -- Component Defaults
    enabled: false
    # -- Create a service account.
    # @section -- Component Defaults
    create: false
    # -- Annotations applied to created service account.
    # @section -- Component Defaults
    annotations: {}
    # -- Service account name.
    # @section -- Component Defaults
    name: ""
    # -- Should the service account access token be automount in the pod.
    # @section -- Component Defaults
    automountServiceAccountToken: false
    role:
      # -- Should the role be created.
      # @section -- Component Defaults
      create: false
      # -- Role rules associated with the service account.
      # @section -- Component Defaults
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Component Defaults
      create: false
      # -- ClusterRole rules associated with the service account.
      # @section -- Component Defaults
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a PodDisruptionBudget for the app
    # @section -- Component Defaults
    enabled: false
    # -- Labels to be added to app pdb.
    # @section -- Component Defaults
    labels: {}
    # -- Annotations to be added to app pdb.
    # @section -- Component Defaults
    annotations: {}
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%). One
    # of `minAvailable` / `maxUnavailable` must be set when `pdb.enabled` is true - a budget of 0
    # is the same as having no budget at all, so leaving both empty fails at render time.
    # @section -- Component Defaults
    minAvailable: ""
    # -- Number of pods that are unavailable after eviction as number or percentage (eg.: 50%). Has higher precedence over `frontend.pdb.minAvailable`.
    # @section -- Component Defaults
    maxUnavailable: ""
  networkPolicy:
    # -- Create NetworkPolicy object for the app. The policy always selects this component's pods
    # only (via its selector labels), never the whole namespace.
    # @section -- Component Defaults
    create: false
    # -- Labels to be added to the app NetworkPolicy.
    # @section -- Component Defaults
    labels: {}
    # -- Annotations to be added to the app NetworkPolicy.
    # @section -- Component Defaults
    annotations: {}
    # -- Policy types used in the NetworkPolicy object.
    # @section -- Component Defaults
    policyTypes:
      - Ingress
    # -- Ingress rules for the NetworkPolicy object.
    # @section -- Component Defaults
    ingress: []
    # - from:
    #   - ipBlock:
    #       cidr: 172.17.0.0/16
    #       except:
    #       - 172.17.1.0/24
    #   - namespaceSelector:
    #       matchLabels:
    #         project: myproject
    #   - podSelector:
    #       matchLabels:
    #         role: frontend
    #   ports:
    #   - protocol: TCP
    #     port: 6379
    # -- Egress rules for the NetworkPolicy object.
    # @section -- Component Defaults
    egress: []
    # - to:
    #   - ipBlock:
    #       cidr: 10.0.0.0/24
    #   ports:
    #   - protocol: TCP
    #     port: 32000
    #     endPort: 32768
  metrics:
    # -- Deploy metrics service.
    # @section -- Component Defaults
    enabled: false
    service:
      # -- Type of metrics service to create.
      # @section -- Component Defaults
      type: "ClusterIP"
      # -- Metrics service annotations.
      # @section -- Component Defaults
      annotations: {}
      # -- Metrics service labels.
      # @section -- Component Defaults
      labels: {}
      # -- Metrics service port name.
      # @section -- Component Defaults
      portName: "metrics"
      # -- Metrics service port.
      # @section -- Component Defaults
      port: 9000
      # -- Metrics service target port.
      # @section -- Component Defaults
      targetPort: 9000
    serviceMonitor:
      # -- Enable a prometheus ServiceMonitor.
      # @section -- Component Defaults
      enabled: false
      # -- Prometheus ServiceMonitor labels.
      # @section -- Component Defaults
      labels: {}
      # -- Prometheus ServiceMonitor annotations.
      # @section -- Component Defaults
      annotations: {}
      endpoints:
        - basicAuth:
            # -- The secret in the service monitor namespace that contains the username for authentication.
            # @section -- Component Defaults
            username: ""
            # -- The secret in the service monitor namespace that contains the password for authentication.
            # @section -- Component Defaults
            password: ""
          bearerTokenSecret:
            # -- Secret name to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Component Defaults
            name: ""
            # -- Secret key to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Component Defaults
            key: ""
          # -- Prometheus ServiceMonitor interval.
          # @section -- Component Defaults
          interval: "30s"
          # -- Prometheus ServiceMonitor scrapeTimeout. If empty, Prometheus uses the global scrape timeout unless it is less than the target's scrape interval value in which the latter is used.
          # @section -- Component Defaults
          scrapeTimeout: "10s"
          # -- Path used by the Prometheus ServiceMonitor to scrape metrics.
          # @section -- Component Defaults
          path: "/metrics"
          # -- When true, honorLabels preserves the metric’s labels when they collide with the target’s labels.
          # @section -- Component Defaults
          honorLabels: false
          # -- Prometheus RelabelConfigs to apply to samples before scraping.
          # @section -- Component Defaults
          relabelings: []
          # -- Prometheus MetricRelabelConfigs to apply to samples before ingestion.
          # @section -- Component Defaults
          metricRelabelings: []
          # -- Prometheus ServiceMonitor selector.
          # @section -- Component Defaults
          selector: {}
          # prometheus: kube-prometheus
          # -- Prometheus ServiceMonitor scheme.
          # @section -- Component Defaults
          scheme: ""
          # -- Prometheus ServiceMonitor tlsConfig.
          # @section -- Component Defaults
          tlsConfig: {}

backend:
  # -- Overrides on top of `componentDefaults` above - only what makes this component
  # different needs to be listed here.
  # @section -- Backend
  image:
    repository: "mitchou10/lisa/backend"
  ingress:
    hosts:
    - name: "domain.local"
      paths:
      - path: "/health"
        pathType: "Prefix"
        backend:
          serviceName: ""
          portNumber: null
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerPort: 8000
  securityContext:
    readOnlyRootFilesystem: true
    runAsUser: 1000
    runAsGroup: 1000
  envCm:
    DATABASE_URL: "postgresql+asyncpg://{{ .Values.secrets.postgresUsername }}:{{ .Values.secrets.postgresPassword }}@lisa-pg-cluster-rw:5432/{{ .Values.cnpg.cluster.initdb.database }}"
    REDIS_URL: "redis://:{{ .Values.redis.auth.password }}@lisa-redis:6379/0"
    CORS_ORIGINS: "[\"https://lisa.local\"]"
    FRONTEND_URL: "https://lisa.local"
    BACKEND_PUBLIC_URL: "https://lisa.local/api"
    KEYCLOAK_SERVER_URL: "https://keycloak.local"
    KEYCLOAK_INTERNAL_URL: "https://keycloak.local"
    KEYCLOAK_REALM: "lisa"
    KEYCLOAK_CLIENT_ID: "lisa-frontend"
    KEYCLOAK_ADMIN_ROLE: "admin"
    SESSION_COOKIE_SECURE: "true"
    S3_ENDPOINT_URL: "http://lisa-rustfs:9000"
    S3_BUCKET: "{{ .Values.s3.bucket }}"
    S3_REGION: "us-east-1"
  envSecret:
    SERVICE_TOKEN: "{{ .Values.secrets.serviceToken }}"
    KEYCLOAK_CLIENT_SECRET: "{{ .Values.secrets.keycloakClientSecret }}"
    S3_ACCESS_KEY: "{{ .Values.rustfs.auth.accessKey }}"
    S3_SECRET_KEY: "{{ .Values.rustfs.auth.secretKey }}"
  probes:
    startupProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 0
      successThreshold: 1
      failureThreshold: 10
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 10
      successThreshold: 2
      failureThreshold: 2
      periodSeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: "/health"
        port: 8000
      initialDelaySeconds: 30
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 5
  service:
    enabled: true
    port: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
frontend:
  # -- Overrides on top of `componentDefaults` above - only what makes this component
  # different needs to be listed here.
  # @section -- Frontend
  image:
    repository: "mitchou10/lisa/frontend"
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  containerPort: 8080
  securityContext:
    readOnlyRootFilesystem: true
