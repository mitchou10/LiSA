# -- Map of extra specs to dynamically add to this chart. Each key is a unique, arbitrary name
# for the object (only used so `-f` values files/overrides can add, override or remove a single
# entry by key instead of the whole list - lists don't merge across values files in Helm).
# @section -- General
extraObjects: {}
# my-configmap:
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: my-configmap
#   data:
#     key: test
# my-vault-secret:
#   apiVersion: secrets.hashicorp.com/v1beta1
#   kind: VaultStaticSecret
#   metadata:
#     name: foo
#     labels:
#       foo/bar: "baz"
#     annotations:
#       foo/bar: "baz"
#   spec:
#     mount: "my-kv"
#     vaultAuthRef: "my-vault-auth"
#     path: "dev/foo"
#     version: 21
#     type: "kv-v2"
#     refreshAfter: "30s"
#     hmacSecretData: true
#     rolloutRestartTargets:
#     - kind: Deployment
#       name: backend
#     destination:
#       create: true
#       overwrite: true
#       labels:
#         foo/bar: "baz"
#       annotations:
#         foo/bar: "baz"
#       name: foo
#       type: "Opaque"
# Basic-auth secrets required by the bundled CNPG cluster (dev defaults). The
# CNPG operator only accepts `kubernetes.io/basic-auth` secrets (username +
# password keys) for `initdb.secret` and `superuserSecret` - Opaque secrets make
# the Cluster wait forever. In DSO environments these are provided by Vault
# instead (see values/common-values.yaml).
#
# These entries are strings (not maps) on purpose: when an environment file
# defines the same key with its own object (e.g. the VaultStaticSecrets in
# values/common-values.yaml), a string base value is replaced wholesale by the
# override, whereas a map base would be deep-merged into it and leak `stringData`
# into the VaultStaticSecret, corrupting it.
extraObjects:
  lisa-db-appuser: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: lisa-db-appuser
    type: kubernetes.io/basic-auth
    stringData:
      username: "{{ .Values.secrets.postgresUsername }}"
      password: "{{ .Values.secrets.postgresPassword }}"
  lisa-db-superuser: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: lisa-db-superuser
    type: kubernetes.io/basic-auth
    stringData:
      username: "postgres"
      password: "{{ .Values.secrets.postgresPassword }}"
## Additional services comming from dependencies can be configured below.
## Ref: https://artifacthub.io/packages/helm/cloudnative-pg/cluster
cnpg:
  enabled: true
  fullnameOverride: "lisa-pg-cluster"
  mode: standalone
  type: postgresql
  version:
    postgresql: "17"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.7"
    instances: 1
    storage:
      size: 3Gi
    walStorage:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    enableSuperuserAccess: true
    superuserSecret: "lisa-db-superuser"
    initdb:
      database: "lisa"
      owner: "lisa"
      secret:
        name: "lisa-db-appuser"


# Bundled stateful services (subcharts). Disable each one and point the components at managed
# services (env of the components above) for a real deployment. The `fullnameOverride`s give the
# services fixed names the components' env refers to.
redis:
  enabled: true
  fullnameOverride: "lisa-redis"
  auth:
    enabled: true
    password: "change-me-redis"
rustfs:
  enabled: true
  fullnameOverride: "lisa-rustfs"
  auth:
    accessKey: "rustfsadmin"
    secretKey: "change-me-rustfs"
  # The files are only reached by the components, inside the cluster.
  ingress:
    enabled: false
  consoleIngress:
    enabled: false
