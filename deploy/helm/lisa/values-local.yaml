# Local-testing overrides for the LiSA chart.
# Usage: helm install lisa ./deploy/helm/lisa -n lisa --create-namespace -f deploy/helm/lisa/values-local.yaml

global:
  # Use locally-built images loaded into the cluster; never pull from a registry.
  imagePullPolicy: Never
  imageTag: "v0.4.0"

# Smaller footprint so it fits on a laptop kind/minikube node.
# NOTE: Helm replaces whole lists (no per-item merge), so redefine the full
# workers list here, not just the fields you want to override.
workers:
  - name: anonymize
    enabled: true
    image:
      repository: lisa-service-anonymize
      tag: ""
      pullPolicy: ""
    replicaCount: 1
    queueName: "llm-guard-anonymize"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi

postgres:
  persistence:
    enabled: false   # ephemeral for quick test cycles

# Keep the insecure defaults ONLY for local testing.
secrets:
  jwtSecret: "local-dev-secret-not-for-prod-0123456789"
  serviceToken: "local-dev-service-token"
