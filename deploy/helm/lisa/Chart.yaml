apiVersion: v2
name: lisa
type: application
version: 1.0.0
appVersion: "1.0.0"
description: A Helm chart to deploy LiSA (LLM security analyzer).
kubeVersion: ">=1.25.0-0"
deprecated: false
dependencies:
  - name: redis
    alias: redis
    version: 0.27.9
    repository: oci://registry-1.docker.io/cloudpirates
    condition: redis.enabled
  - name: postgres
    alias: postgres
    version: 0.19.6
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: rustfs
    alias: rustfs
    version: 0.10.0
    repository: oci://registry-1.docker.io/cloudpirates
    condition: rustfs.enabled
