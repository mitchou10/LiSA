apiVersion: v2
name: lisa
type: application
version: 1.2.1
appVersion: "1.2.1"
description: A Helm chart to deploy LiSA (LLM security analyzer).
kubeVersion: ">=1.25.0-0"
deprecated: false
dependencies:
  - name: redis
    alias: redis
    version: 0.27.9
    repository: oci://registry-1.docker.io/cloudpirates
    condition: redis.enabled
  - name: cluster
    alias: cnpg
    version: 0.8.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg.enabled
  - name: rustfs
    alias: rustfs
    version: 0.10.0
    repository: oci://registry-1.docker.io/cloudpirates
    condition: rustfs.enabled
