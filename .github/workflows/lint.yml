name: Lint

# Thin wrapper around each side's own tooling: ruff (check + format) for every
# Python package, a production build for the frontend (there is no separate
# typecheck script).

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: Node version used to build the frontend
        required: false
        type: string
        default: "20"
      PYTHON_VERSION:
        description: Python version used to run the Python linters
        required: false
        type: string
        default: "3.13"
  workflow_dispatch:
    inputs:
      NODE_VERSION:
        description: Node version used to build the frontend
        required: false
        type: string
        default: "20"
      PYTHON_VERSION:
        description: Python version used to run the Python linters
        required: false
        type: string
        default: "3.13"

jobs:
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  lint-workers:
    name: Lint worker and services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}

      - name: Ruff check
        run: uvx ruff check worker services

      - name: Ruff format check
        run: uvx ruff format --check worker services

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
