name: Unit Tests

# Backend, the shared worker package and the anonymize, classification, safety,
# ner and relation services. The frontend has no test suite, and the
# other worker services need heavy dependencies (liteparse)
# that are not installed here. Add jobs for them once their tests can run
# against mocks alone.

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.13"
      SERVICES_PYTHON_VERSION:
        description: Python version used to run the worker services tests
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.13"
      SERVICES_PYTHON_VERSION:
        description: Python version used to run the worker services tests
        required: false
        type: string
        default: "3.12"

jobs:
  unit-tests-backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest -q

  # The services pin Python < 3.13 (their ML dependencies), hence a separate version.
  unit-tests-anonymize:
    name: services/anonymize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.SERVICES_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            services/anonymize/pyproject.toml
            worker/pyproject.toml

      - name: Install service dependencies
        working-directory: services/anonymize
        run: uv sync --extra dev

      - name: Run tests
        working-directory: services/anonymize
        run: uv run pytest

  # The model is faked in these tests: only pydantic, celery and the worker
  # package are installed (the [local] extra of gliner2, i.e. torch, is not).
  unit-tests-classification:
    name: services/classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.SERVICES_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            services/classification/pyproject.toml
            worker/pyproject.toml

      - name: Run tests
        working-directory: services/classification
        run: >-
          uv run --no-project
          --with-editable ../../worker
          --with "celery[redis]" --with pydantic --with pydantic-settings
          --with pytest --with pytest-mock
          pytest

  unit-tests-safety:
    name: services/safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.SERVICES_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            services/safety/pyproject.toml
            worker/pyproject.toml

      - name: Run tests
        working-directory: services/safety
        run: >-
          uv run --no-project
          --with-editable ../../worker
          --with "celery[redis]" --with pydantic --with pydantic-settings
          --with pytest --with pytest-mock
          pytest

  unit-tests-ner:
    name: services/ner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.SERVICES_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            services/ner/pyproject.toml
            worker/pyproject.toml

      - name: Run tests
        working-directory: services/ner
        run: >-
          uv run --no-project
          --with-editable ../../worker
          --with "celery[redis]" --with pydantic --with pydantic-settings
          --with redis --with pytest --with pytest-mock
          pytest

  unit-tests-relation:
    name: services/relation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.SERVICES_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            services/relation/pyproject.toml
            worker/pyproject.toml

      - name: Run tests
        working-directory: services/relation
        run: >-
          uv run --no-project
          --with-editable ../../worker
          --with "celery[redis]" --with pydantic --with pydantic-settings
          --with pytest --with pytest-mock
          pytest

  unit-tests-worker:
    name: worker (shared package)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.SERVICES_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/pyproject.toml

      - name: Run tests
        working-directory: worker
        run: uv run --no-project --with-editable . --with pytest --with respx pytest

  # CLIP is never loaded here: a fake model and a fake bucket stand in, so
  # neither torch nor transformers is installed.
  unit-tests-image-classification:
    name: services/image-classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.SERVICES_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            services/image-classification/pyproject.toml
            worker/pyproject.toml

      - name: Run tests
        working-directory: services/image-classification
        run: >-
          uv run --no-project
          --with-editable ../../worker
          --with "celery[redis]" --with pydantic --with pydantic-settings
          --with boto3 --with pillow
          --with pytest --with pytest-mock
          pytest
