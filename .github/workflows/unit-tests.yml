name: Unit Tests

# Backend only: the frontend has no test suite, and the worker services need
# heavy ML dependencies (gliner, llm-guard, liteparse) that are not installed
# here. Add jobs for them once their tests can run against mocks alone.

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.13"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.13"

jobs:
  unit-tests-backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest -q
