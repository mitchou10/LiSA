services:
  db:
    image: postgres:16-alpine
    container_name: lisa-db
    environment:
      POSTGRES_USER: lisa
      POSTGRES_PASSWORD: lisa
      POSTGRES_DB: lisa
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa -d lisa"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lisa

  server:
    image: lisa-server:v0.4.0
    container_name: lisa-server
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://lisa:lisa@db:5432/lisa
      CORS_ORIGINS: '["*"]'
      REDIS_URL: redis://redis:6379/0
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-with-a-long-random-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-admin}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lisa

  redis:
    image: redis:7-alpine
    container_name: lisa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lisa

  anonymize:
    image: lisa-service-anonymize:v0.4.0
    container_name: lisa-anonymize
    build:
      context: .
      dockerfile: services/anonymize/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${ANONYMIZE_QUEUE:-llm-guard-anonymize}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - lisa

  safety:
    image: lisa-service-safety:v0.4.0
    container_name: lisa-safety
    build:
      context: .
      dockerfile: services/safety/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${SAFETY_QUEUE:-llm-guard-safety}
      ENABLED_SCANNERS: ${ENABLED_SCANNERS:-prompt_injection,toxicity,secrets}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - lisa

  frontend:
    image: lisa-frontend:v0.4.0
    container_name: lisa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - lisa

volumes:
  db-data:
    driver: local

networks:
  lisa:
    driver: bridge
