services:
  frontend:
    image: lisa-frontend:v0.1.0
    container_name: lisa-frontend
    volumes:
      - ./apps/frontend:/app/frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: frontend
    env_file:
      - ${PWD}/.env.example
    networks:
      - lisa
volumes:
  db-data:
    driver: local
  broker-lib:
    driver: local
  broker-log:
    driver: local

networks:
  lisa:
    external: true
