services:
  db:
    image: postgres:16-alpine
    container_name: lisa-db
    environment:
      POSTGRES_USER: lisa
      POSTGRES_PASSWORD: lisa
      POSTGRES_DB: lisa
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa -d lisa"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lisa

  server:
    image: lisa-server:v0.4.0
    container_name: lisa-server
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://lisa:lisa@db:5432/lisa
      # Credentialed (cookie) CORS cannot use "*": list the frontend origin(s).
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
      REDIS_URL: redis://redis:6379/0
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://localhost:8180}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lisa}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-lisa-frontend}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-admin}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-only-secret-not-for-prod}
      # BFF: URLs the browser uses (OAuth2 redirect_uri, post-login redirect).
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8010}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-lisa-files}
    ports:
      - "${SERVER_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    # Workers register themselves on start: they wait for this to be healthy.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - lisa

  keycloak-db:
    image: postgres:16-alpine
    container_name: lisa-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lisa

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lisa-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed public URL so the token issuer is stable (browser and server agree).
      KC_HOSTNAME: ${KEYCLOAK_SERVER_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/lisa-realm.json:/opt/keycloak/data/import/lisa-realm.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - lisa

  # RustFS runs as a non-root user (uid 10001); named volumes default to root
  # ownership, so this one-shot fixes permissions before rustfs starts.
  rustfs-volume-permissions:
    image: alpine
    volumes:
      - rustfs-data:/data
    command: chown -R 10001:10001 /data
    restart: "no"
    networks:
      - lisa

  # S3-compatible object storage for uploaded files. Only the backend talks to it.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: lisa-rustfs
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - lisa

  redis:
    image: redis:7-alpine
    container_name: lisa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lisa

  anonymize:
    image: lisa-service-anonymize:v0.4.0
    container_name: lisa-anonymize
    build:
      context: .
      dockerfile: services/anonymize/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${ANONYMIZE_QUEUE:-llm-guard-anonymize}
      AWS_S3_ENDPOINT_URL: http://rustfs:9000
      AWS_S3_BUCKET: ${S3_BUCKET:-lisa-files}
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - lisa

  safety:
    image: lisa-service-safety:v0.4.0
    container_name: lisa-safety
    build:
      context: .
      dockerfile: services/safety/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${SAFETY_QUEUE:-safety}
      SAFETY_MODEL: ${SAFETY_MODEL:-fastino/GLiNER2-Guardrails-PII-Multi}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - lisa

  ner:
    image: lisa-service-ner:v0.4.0
    container_name: lisa-ner
    build:
      context: .
      dockerfile: services/ner/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${NER_QUEUE:-ner}
      NER_MODEL: ${NER_MODEL:-fastino/gliner2.5-multi-v1}
      NER_THRESHOLD: ${NER_THRESHOLD:-0.5}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - lisa

  relation:
    image: lisa-service-relation:v0.4.0
    container_name: lisa-relation
    build:
      context: .
      dockerfile: services/relation/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${RELATION_QUEUE:-relation}
      RELATION_MODEL: ${RELATION_MODEL:-fastino/gliner2.5-multi-v1}
      RELATION_THRESHOLD: ${RELATION_THRESHOLD:-0.5}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - lisa

  classification:
    image: lisa-service-classification:v0.4.0
    container_name: lisa-classification
    build:
      context: .
      dockerfile: services/classification/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${CLASSIFICATION_QUEUE:-classification}
      CLASSIFIER_BACKEND: ${CLASSIFIER_BACKEND:-gliner2}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-fastino/gliner2.5-multi-v1}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - lisa

  parser:
    image: lisa-service-parser:v0.4.0
    container_name: lisa-parser
    build:
      context: .
      dockerfile: services/parser/Dockerfile
      args:
        OCR_LANGUAGE: ${OCR_LANGUAGE:-eng+fra}
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${PARSER_QUEUE:-liteparse-ocr}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng+fra}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-lisa-files}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - lisa

  frontend:
    image: lisa-frontend:v0.4.0
    container_name: lisa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - lisa

volumes:
  db-data:
    driver: local
  keycloak-db-data:
    driver: local
  rustfs-data:
    driver: local

networks:
  lisa:
    driver: bridge
