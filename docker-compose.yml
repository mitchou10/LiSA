
services:
  consumer:
    image: lisa-consumer:v0.1.0
    container_name: lisa-consumer
    volumes:
      - ./apps/server/worker:/app/worker
    build:
      context: .
      dockerfile: Dockerfile
      target: guard
    env_file:
      -  ${PWD}/.env.example
    networks:
      - async-api_default
volumes:
  db-data:
    driver: local
  broker-lib:
    driver: local
  broker-log:
    driver: local

networks:
  async-api_default:
    external: true
