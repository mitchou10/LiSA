services:
  db:
    image: postgres:16-alpine
    container_name: lisa-db
    environment:
      POSTGRES_USER: lisa
      POSTGRES_PASSWORD: lisa
      POSTGRES_DB: lisa
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa -d lisa"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lisa

  server:
    image: lisa-server:v0.4.0
    container_name: lisa-server
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://lisa:lisa@db:5432/lisa
      # Credentialed (cookie) CORS cannot use "*": list the frontend origin(s).
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
      REDIS_URL: redis://redis:6379/0
      AUTH_PROVIDER: ${AUTH_PROVIDER:-keycloak}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-with-a-long-random-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://localhost:8180}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lisa}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-lisa-frontend}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-admin}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-only-secret-not-for-prod}
      # BFF: URLs the browser uses (OAuth2 redirect_uri, post-login redirect).
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8010}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${SERVER_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - lisa

  keycloak-db:
    image: postgres:16-alpine
    container_name: lisa-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lisa

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lisa-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed public URL so the token issuer is stable (browser and server agree).
      KC_HOSTNAME: ${KEYCLOAK_SERVER_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/lisa-realm.json:/opt/keycloak/data/import/lisa-realm.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - lisa

  redis:
    image: redis:7-alpine
    container_name: lisa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lisa

  anonymize:
    image: lisa-service-anonymize:v0.4.0
    container_name: lisa-anonymize
    build:
      context: .
      dockerfile: services/anonymize/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${ANONYMIZE_QUEUE:-llm-guard-anonymize}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - lisa

  safety:
    image: lisa-service-safety:v0.4.0
    container_name: lisa-safety
    build:
      context: .
      dockerfile: services/safety/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${SAFETY_QUEUE:-llm-guard-safety}
      ENABLED_SCANNERS: ${ENABLED_SCANNERS:-prompt_injection,toxicity,secrets}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - lisa

  gliner:
    image: lisa-service-gliner:v0.4.0
    container_name: lisa-gliner
    build:
      context: .
      dockerfile: services/gliner/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${GLINER_QUEUE:-gliner-ner}
      GLINER_MODEL: ${GLINER_MODEL:-gliner-community/gliner_small-v2.5}
      GLINER_THRESHOLD: ${GLINER_THRESHOLD:-0.5}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - lisa

  parser:
    image: lisa-service-parser:v0.4.0
    container_name: lisa-parser
    build:
      context: .
      dockerfile: services/parser/Dockerfile
      args:
        OCR_LANGUAGE: ${OCR_LANGUAGE:-eng+fra}
    environment:
      REDIS_URL: redis://redis:6379/0
      LISA_API_URL: http://server:8000
      LISA_SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-service-token}
      CELERY_QUEUE: ${PARSER_QUEUE:-liteparse-ocr}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-eng+fra}
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - lisa

  frontend:
    image: lisa-frontend:v0.4.0
    container_name: lisa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - lisa

volumes:
  db-data:
    driver: local
  keycloak-db-data:
    driver: local

networks:
  lisa:
    driver: bridge
