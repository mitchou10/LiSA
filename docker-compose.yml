services:
  db:
    image: postgres:16-alpine
    container_name: lisa-db
    environment:
      POSTGRES_USER: lisa
      POSTGRES_PASSWORD: lisa
      POSTGRES_DB: lisa
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa -d lisa"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lisa

  server:
    image: lisa-server:v0.1.0
    container_name: lisa-server
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://lisa:lisa@db:5432/lisa
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lisa

  frontend:
    image: lisa-frontend:v0.1.0
    container_name: lisa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - lisa

volumes:
  db-data:
    driver: local

networks:
  lisa:
    driver: bridge
