[project]
name = "lisa-server"
version = "1.4.0"
description = "LiSA backend API: services & tasks management"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "celery[redis]>=5.6.3",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "alembic>=1.20.0",
    "redis>=8.1.0",
    "httpx>=0.27.0",
    "boto3>=1.43.117",
    "supervision>=0.31.1",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.22.1",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"
